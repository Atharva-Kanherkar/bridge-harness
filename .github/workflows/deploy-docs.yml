name: Deploy docs site to GitHub Pages

# Manual trigger only, deliberately. This repo is private; enabling Pages
# publishes docs-site/ to the open internet (a github.io URL) regardless of
# that, unless the account has private-Pages support. Going live should be
# an explicit action, not a side effect of merging a branch — so there is
# no push-to-main trigger here. Run this from the Actions tab, or
# `gh workflow run deploy-docs.yml`, once GitHub Pages is enabled for this
# repo (Settings -> Pages -> Source: GitHub Actions) and you actually want
# the current content live.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
