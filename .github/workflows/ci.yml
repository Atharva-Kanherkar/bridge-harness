name: CI

# Strict gate: typecheck + build + all three test suites on every branch
# push and every pull request. deploy-docs.yml stays manual-dispatch only,
# deliberately — see the comment at the top of that file.

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing in this workflow writes back to the repository.
permissions:
  contents: read

# A new push to the same branch or PR cancels its superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck + build (tsc -b && vite build)
        run: bun run build

      - name: Web tests (vitest)
        run: bunx vitest run

      - name: Release scripts and crash report tests
        run: npm run test:release

      - name: Release version consistency
        run: node scripts/release-version.mjs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Rust terminal integration tests launch the Node history sidecar.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # Compiling the tauri shell on Linux pulls its gtk/webkit2gtk sys-crates,
      # whose build scripts need the system dev headers (glib-2.0 and friends).
      # macOS never sees these paths, so this is invisible to local check/test.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # The Rust job does not build the frontend, but tauri::generate_context!
      # (src-tauri/src/lib.rs) reads frontendDist ("../dist") at compile time
      # and fails if the directory is missing. Stub an empty one; only
      # check/test run here, never a bundle, so empty assets are fine.
      - name: Stub frontend dist for tauri codegen
        run: mkdir -p dist

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (workspace)
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: cargo test (workspace)
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

  macos-package-smoke:
    name: macOS packaged app smoke
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-package-smoke
          cache-on-failure: true

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build credential-free packaged app
        timeout-minutes: 45
        run: npm run build:macos-smoke

      - name: Exercise packaged app and bundled daemon
        timeout-minutes: 3
        run: npm run smoke:macos-app

  sidecar:
    name: Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node runs the tests (node --test). Bun installs the root workspace so
      # the Claude Agent SDK resolves from the bun.lock pin instead of a
      # freshly floated npm resolve — the sidecar is a bun workspace member.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install root workspace (pinned SDK)
        run: bun install --frozen-lockfile

      - name: Sidecar tests (node --test)
        run: npm test --prefix sidecar/claude-agent
