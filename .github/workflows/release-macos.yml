# Both local release and CI use the same signature, icon, and notarization gates.
# Required secrets: APPLE_CERTIFICATE (base64 Developer ID Application .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_KEY, and
# APPLE_API_KEY_P8. APPLE_API_ISSUER is required for Team API keys; omit it for
# Individual API keys. No artifact is published until all verification passes.
name: Release macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-macos-public
  # Preserve merges queued while a DMG is building (up to 100 pending runs).
  queue: max
  cancel-in-progress: false

jobs:
  dmg:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare or resume the release for this merge
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-release.mjs prepare

      - name: Validate signing inputs
        if: steps.release.outputs.published != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Public release requires these repository secrets:$missing" >&2
            exit 1
          fi

      - name: Install locked dependencies
        if: steps.release.outputs.published != 'true'
        run: bun install --frozen-lockfile

      - name: Import signing identity into a temporary keychain
        if: steps.release.outputs.published != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/bridge-signing.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/bridge-auth.p8"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/bridge-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/bridge-signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/bridge-signing.keychain-db"
          security import "$RUNNER_TEMP/bridge-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$RUNNER_TEMP/bridge-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/bridge-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/bridge-signing.keychain-db" login.keychain-db

      - name: Build, test, sign, notarize, and verify exact DMG contents
        if: steps.release.outputs.published != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/bridge-auth.p8
          # Keep native process/socket tests within the runner's resource limits.
          RUST_TEST_THREADS: "2"
        run: sh scripts/release-dmg.sh

      - name: Retain verified DMG and checksum
        if: steps.release.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-macOS-verified
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error

      - name: Publish the verified release
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node scripts/ci-release.mjs publish

      - name: Record release result
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          printf '%s\n' "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" "Source: $GITHUB_SHA" "Versioned build: $RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bridge-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/bridge-signing.p12" "$RUNNER_TEMP/bridge-auth.p8"
