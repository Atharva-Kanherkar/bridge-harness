name: Stale issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "epic,good first issue,priority:high,priority: critical,format-exempt"
          exempt-pr-labels: "epic,good first issue,priority:high,priority: critical"
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 14 days
            unless there is new activity. Epic, good first issue, and high-priority
            labels are exempt. Comment or push an update to keep it open.
          stale-pr-message: >
            This pull request has been inactive for 30 days and will be closed in 14
            days unless there is new activity. Comment or push an update to keep it open.
          close-issue-message: >
            Closed automatically after the stale period with no activity. Reopen or
            open a fresh issue if the work is still needed.
          close-pr-message: >
            Closed automatically after the stale period with no activity. Reopen or
            open a new PR if the work should continue.
