name: Linux release candidates

on:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'sidecar/**', 'scripts/**', 'packaging/**', 'package.json', 'bun.lock', '.github/workflows/release-linux.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Build Debian and AppImage candidates
        run: bun run tauri build --config src-tauri/tauri.linux.conf.json --ci
      - name: Check package contents and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-linux
          cp src-tauri/target/release/bundle/deb/*.deb release-linux/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-linux/
          deb=$(find release-linux -name '*.deb' -print -quit)
          dpkg-deb --contents "$deb"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/bridge-deb"
          test -x "$RUNNER_TEMP/bridge-deb/usr/bin/bridge-deck"
          for resource in sidecar/claude-agent/index.mjs sidecar/terminal-state/index.mjs; do
            test "$(find "$RUNNER_TEMP/bridge-deb" -path "*/$resource" | wc -l)" -eq 1
          done
          test "$(find "$RUNNER_TEMP/bridge-deb" -name bridged -type f | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/bridge-deb" -name bridge-browser-host -type f | wc -l)" -eq 1
          cd release-linux
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS
      - name: Smoke-test the installed Debian app on X11
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i release-linux/*.deb
          printf '%s\n' '{"op":"list","workspaceId":"smoke"}' | node /usr/lib/bridge-deck/sidecar/terminal-state/index.mjs "$RUNNER_TEMP/bridge-terminal-smoke" > "$RUNNER_TEMP/bridge-terminal-smoke.json"
          node -e 'const fs = require("node:fs"); const reply = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(reply.result) || reply.result.length !== 0) process.exit(1)' "$RUNNER_TEMP/bridge-terminal-smoke.json"
          export XDG_DATA_HOME="$RUNNER_TEMP/bridge-smoke-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/bridge-smoke-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/bridge-smoke-cache"
          set +e
          timeout 15s xvfb-run -a /usr/bin/bridge-deck > "$RUNNER_TEMP/bridge-smoke.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/bridge-smoke.log"
          test "$status" -eq 124
      - name: Retain Linux candidates
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-Linux-x86_64-candidate
          path: release-linux/
          if-no-files-found: error

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git nodejs libarchive
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-Linux-x86_64-candidate
          path: release-linux
      - name: Build an Arch package from the checked Debian artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-linux
          sha256sum -c SHA256SUMS
          cd ..
          useradd -m builder
          mkdir -p /tmp/bridge-arch
          cp packaging/arch/PKGBUILD LICENSE release-linux/*.deb /tmp/bridge-arch/
          cd /tmp/bridge-arch
          deb=$(find . -maxdepth 1 -name '*.deb' -printf '%f\n')
          [[ "$deb" =~ ^[Bb]ridge_[0-9.]+_amd64.deb$ ]]
          printf '\nsource=("%s" "LICENSE")\nsha256sums=("%s" "%s")\n' "$deb" "$(sha256sum "$deb" | cut -d ' ' -f 1)" "$(sha256sum LICENSE | cut -d ' ' -f 1)" >> PKGBUILD
          chown -R builder:builder /tmp/bridge-arch
          su builder -c 'cd /tmp/bridge-arch && makepkg --nodeps --noconfirm'
          pacman -Qip ./*.pkg.tar.zst
          pacman -U --noconfirm ./*.pkg.tar.zst
          ldd /usr/bin/bridge-deck > /tmp/bridge-arch-libraries.log
          cat /tmp/bridge-arch-libraries.log
          ! grep -q 'not found' /tmp/bridge-arch-libraries.log
          sha256sum ./*.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-Arch-x86_64-candidate
          path: |
            /tmp/bridge-arch/*.pkg.tar.zst
            /tmp/bridge-arch/SHA256SUMS
          if-no-files-found: error
