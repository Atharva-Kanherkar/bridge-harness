<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/assets/bridge-icon.svg" />
    <title>Bridge</title>
    <script>
      // Resolve the theme before first paint so the app never flashes the
      // wrong ground. Mirrors src/theme.ts; kept inline and dependency-free.
      (function () {
        try {
          var stored = localStorage.getItem("bridge.theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var skin = localStorage.getItem("bridge.skin") === "vibrancy" ? "vibrancy" : "graphite";
          document.documentElement.dataset.skin = skin;
          if ("__TAURI_INTERNALS__" in window) document.documentElement.dataset.tauri = "";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? (skin === "vibrancy" ? "#111111" : "#000000") : "#fafaf9");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-background" aria-hidden="true">
      <span class="boot-splash-mark select-none font-display text-[13px] font-medium uppercase tracking-[0.5em] text-foreground/80">Bridge</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
