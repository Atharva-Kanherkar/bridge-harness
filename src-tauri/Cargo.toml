[workspace]
members = ["bridge-client", "bridge-core", "bridge-protocol", "bridged"]

# Single version for every crate in the workspace: bridge-core reports
# CARGO_PKG_VERSION in the health endpoint and provider handshakes, so it must
# never drift from the application version.
[workspace.package]
version = "0.5.6"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[package]
name = "bridge-deck"
version = { workspace = true }
description = "Local control room for supervised coding-agent workspaces"
authors = ["Bridge"]
edition = "2021"
default-run = "bridge-deck"

[lib]
name = "bridge_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }

[dependencies]
bridge-core = { path = "bridge-core" }
bridge-protocol = { path = "bridge-protocol" }
bridge-client = { path = "bridge-client" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
portable-pty = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# In-process daemon hosting for the proxy integration tests.
bridged = { path = "bridged" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Use typed public AppKit APIs for the material behind the webview. Native
# titlebar controls remain under AppKit's control.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSResponder", "NSColor", "NSVisualEffectView", "NSUserInterfaceItemIdentification", "objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
