[package]
name = "bridge-deck"
version = "0.1.0"
description = "Local control room for supervised coding-agent workspaces"
authors = ["Bridge"]
edition = "2021"

[lib]
name = "bridge_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
which = "7"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
