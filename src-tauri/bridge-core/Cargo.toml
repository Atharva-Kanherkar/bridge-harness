[package]
name = "bridge-core"
version = { workspace = true }
description = "Tauri-free runtime for Bridge: stores, adapters, PTY sessions, policy, and supervision"
authors = ["Bridge"]
edition = "2021"
# Embedded assets (browser-skills, prompts, test fixtures) live at the repo
# root, outside this package — the crate is a workspace-internal library and
# cannot be packaged standalone.
publish = false

[dependencies]
bridge-protocol = { path = "../bridge-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
portable-pty = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
which = "7"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["sync"] }
# The Agent Client Protocol SDK. Pinned exactly: the API moved wholesale
# between 1.0 and 2.0 within a month, and a silent minor bump would rewrite the
# connection shape underneath the ACP client layer. The crate pulls no async
# runtime of its own — futures, async-io and async-process only — which is
# what lets `acp_session` drive a connection on a plain thread like every other
# adapter here.
agent-client-protocol = "=2.0.0"
futures = "0.3"
async-io = "2"
sha2 = "0.10"
# Signature verification for Bridge Verified catalog snapshots. Verification
# only — Bridge never signs on the desktop. Ed25519 because it has no parameter
# negotiation and no curve selection, so there is no configuration to get wrong.
ed25519-dalek = "2"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
zeroize = "1"
cap-std = "4.0.2"
# Archive handling for managed runtime payloads. Entries are validated before
# being written, which a shell-out to `tar` cannot express.
tar = "0.4"
flate2 = "1"
tempfile = { workspace = true }
